name: Build Custom Client
on:
  workflow_dispatch:
    inputs:
      client_guid:
        description: 'Unique identifier of custom client'
        required: true
      client_name:
        description: 'Application Name'
        required: true
      client_exe_name:
        description: 'Target executable filename'
        required: true
      client_prefix:
        description: 'Target filename prefix'
        required: true
      logo_png_base64:
        description: 'Base64 encoded custom logo'
        required: true
      relay_host:
        description: 'Rendezvous relay server host'
        required: true
      relay_key:
        description: 'Rendezvous server public key'
        required: true
      api_server:
        description: 'Preconfigured API server url'
        required: true
      custom_txt_base64:
        description: 'Signed custom.txt payload base64'
        required: true
      apply_patches:
        description: 'Comma-separated patch ids to apply (e.g. 03)'
        required: false
  repository_dispatch:
    types: [build-custom-client]

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-flutter:
    name: Build Branded Windows Flutter Client (64-bit)
    needs: [generate-bridge, build-RustDeskTempTopMostWindow]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-flutter

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Pillow for Icon Generation
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Custom Icons and Assets
        run: |
          Set-Content -Path logo_base64.txt -Value "${{ github.event.client_payload.logo_png_base64 || github.event.inputs.logo_png_base64 }}"
          python make_icons.py logo_base64.txt "${{ github.event.client_payload.client_name || github.event.inputs.client_name }}"

      - name: Setup Custom Environment variables for oneKey.py
        shell: bash
        run: |
          echo "NEW_APP_NAME=${{ github.event.client_payload.client_name || github.event.inputs.client_name }}" >> $GITHUB_ENV
          echo "NEW_EXE_NAME=${{ github.event.client_payload.client_exe_name || github.event.inputs.client_exe_name }}" >> $GITHUB_ENV
          echo "NEW_PREFIX=${{ github.event.client_payload.client_prefix || github.event.inputs.client_prefix }}" >> $GITHUB_ENV
          echo "NEW_IP=${{ github.event.client_payload.relay_host || github.event.inputs.relay_host }}" >> $GITHUB_ENV
          echo "NEW_PUB_KEY=${{ github.event.client_payload.relay_key || github.event.inputs.relay_key }}" >> $GITHUB_ENV
          echo "NEW_API_SERVER=${{ github.event.client_payload.api_server || github.event.inputs.api_server }}" >> $GITHUB_ENV
          echo "CUSTOM_TXT_BASE64=${{ github.event.client_payload.custom_txt_base64 || github.event.inputs.custom_txt_base64 }}" >> $GITHUB_ENV
          echo "APPLY_PATCHES=${{ github.event.client_payload.apply_patches || github.event.inputs.apply_patches }}" >> $GITHUB_ENV

      - name: Run Customize Script and Apply Patches
        run: |
          python oneKey.py

      - name: Build Windows Flutter Executable
        run: |
          # 1. Build Windows Flutter Executable (64-bit modern UI)
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram

          # 2. Create raw release structure
          mkdir ./Release_Flutter
          mv ./flutter/build/windows/x64/runner/Release/* ./Release_Flutter/

          # Download usbmmidd_v2.zip and extract it to ./Release_Flutter
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./Release_Flutter/

          # Download printer driver files and extract them to ./Release_Flutter
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./Release_Flutter/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./Release_Flutter/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./Release_Flutter/
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts
          path: "./Release_Flutter"

      - name: Compile and Pack Flutter Portable Single EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          cp src/custom.txt Release_Flutter/custom.txt || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release_Flutter/ -o . -e ../../Release_Flutter/${NEW_EXE_NAME}
          popd
          mkdir -p ./flutter_out
          mv ./target/release/rustdesk-portable-packer.exe ./flutter_out/${NEW_APP_NAME}.exe

      - name: Upload Flutter Client Temp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-flutter-client
          path: ./flutter_out/

  build-windows-sciter-x64:
    name: Build Branded Windows Sciter Client (64-bit)
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-sciter-x64

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Pillow for Icon Generation
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Custom Icons and Assets
        run: |
          Set-Content -Path logo_base64.txt -Value "${{ github.event.client_payload.logo_png_base64 || github.event.inputs.logo_png_base64 }}"
          python make_icons.py logo_base64.txt "${{ github.event.client_payload.client_name || github.event.inputs.client_name }}"

      - name: Setup Custom Environment variables for oneKey.py
        shell: bash
        run: |
          echo "NEW_APP_NAME=${{ github.event.client_payload.client_name || github.event.inputs.client_name }}" >> $GITHUB_ENV
          echo "NEW_EXE_NAME=${{ github.event.client_payload.client_exe_name || github.event.inputs.client_exe_name }}" >> $GITHUB_ENV
          echo "NEW_PREFIX=${{ github.event.client_payload.client_prefix || github.event.inputs.client_prefix }}" >> $GITHUB_ENV
          echo "NEW_IP=${{ github.event.client_payload.relay_host || github.event.inputs.relay_host }}" >> $GITHUB_ENV
          echo "NEW_PUB_KEY=${{ github.event.client_payload.relay_key || github.event.inputs.relay_key }}" >> $GITHUB_ENV
          echo "NEW_API_SERVER=${{ github.event.client_payload.api_server || github.event.inputs.api_server }}" >> $GITHUB_ENV
          echo "CUSTOM_TXT_BASE64=${{ github.event.client_payload.custom_txt_base64 || github.event.inputs.custom_txt_base64 }}" >> $GITHUB_ENV
          echo "APPLY_PATCHES=${{ github.event.client_payload.apply_patches || github.event.inputs.apply_patches }}" >> $GITHUB_ENV

      - name: Run Customize Script and Apply Patches
        run: |
          python oneKey.py

      - name: Build Windows Sciter x64 Executable
        shell: bash
        run: |
          # 1. Run Sciter inline resource compiler script
          python3 res/inline-sciter.py

          # 2. Build the Sciter 64-bit release binary
          cargo build --locked --release --features inline,vram,hwcodec --bins

          # 3. Prepare the temporary Sciter release directory
          mkdir -p ./Release_Sciter_x64
          mv ./target/release/rustdesk.exe ./Release_Sciter_x64/rustdesk.exe

          # 4. Download 64-bit sciter.dll
          curl -LJ -o ./Release_Sciter_x64/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x64/sciter.dll

          # 5. Download and extract usbmmidd_v2 driver into the release folder
          curl -LJ -o ./usbmmidd_v2_sciter.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip ./usbmmidd_v2_sciter.zip
          rm -rf ./usbmmidd_v2/Win32 ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release_Sciter_x64/

          # 6. Generate the self-extracted portable installer
          sed -i '/dpiAware/d' res/manifest.xml
          cp src/custom.txt Release_Sciter_x64/custom.txt || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release_Sciter_x64/ -o . -e ../../Release_Sciter_x64/rustdesk.exe
          popd

          # 7. Move and rename the final portable installer
          mkdir -p ./sciter_x64_out
          mv ./target/release/rustdesk-portable-packer.exe ./sciter_x64_out/${NEW_APP_NAME}-win7-legacy-x64.exe

      - name: Upload Sciter x64 Client Temp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-sciter-x64-client
          path: ./sciter_x64_out/

  build-windows-sciter-x86:
    name: Build Branded Windows Sciter Client (32-bit)
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install LLVM and Clang (32-bit)
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2023-10-13-i686-pc-windows-msvc
          targets: i686-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022-sciter-x86

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x86-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Pillow for Icon Generation
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Custom Icons and Assets
        run: |
          Set-Content -Path logo_base64.txt -Value "${{ github.event.client_payload.logo_png_base64 || github.event.inputs.logo_png_base64 }}"
          python make_icons.py logo_base64.txt "${{ github.event.client_payload.client_name || github.event.inputs.client_name }}"

      - name: Setup Custom Environment variables for oneKey.py
        shell: bash
        run: |
          echo "NEW_APP_NAME=${{ github.event.client_payload.client_name || github.event.inputs.client_name }}" >> $GITHUB_ENV
          echo "NEW_EXE_NAME=${{ github.event.client_payload.client_exe_name || github.event.inputs.client_exe_name }}" >> $GITHUB_ENV
          echo "NEW_PREFIX=${{ github.event.client_payload.client_prefix || github.event.inputs.client_prefix }}" >> $GITHUB_ENV
          echo "NEW_IP=${{ github.event.client_payload.relay_host || github.event.inputs.relay_host }}" >> $GITHUB_ENV
          echo "NEW_PUB_KEY=${{ github.event.client_payload.relay_key || github.event.inputs.relay_key }}" >> $GITHUB_ENV
          echo "NEW_API_SERVER=${{ github.event.client_payload.api_server || github.event.inputs.api_server }}" >> $GITHUB_ENV
          echo "CUSTOM_TXT_BASE64=${{ github.event.client_payload.custom_txt_base64 || github.event.inputs.custom_txt_base64 }}" >> $GITHUB_ENV
          echo "APPLY_PATCHES=${{ github.event.client_payload.apply_patches || github.event.inputs.apply_patches }}" >> $GITHUB_ENV

      - name: Run Customize Script and Apply Patches
        run: |
          python oneKey.py

      - name: Build Windows Sciter x86 Executable
        shell: bash
        run: |
          # 1. Run Sciter inline resource compiler script
          python3 res/inline-sciter.py

          # 2. Patch sciter x86
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e

          # 3. Build the Sciter 32-bit release binary
          cargo build --locked --release --features inline,vram,hwcodec --bins

          # 4. Prepare the temporary Sciter release directory
          mkdir -p ./Release_Sciter_x86
          mv ./target/release/rustdesk.exe ./Release_Sciter_x86/rustdesk.exe

          # 5. Download 32-bit sciter.dll (critical for legacy Windows)
          curl -LJ -o ./Release_Sciter_x86/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll

          # 6. Download and extract usbmmidd_v2 driver into the release folder
          curl -LJ -o ./usbmmidd_v2_sciter.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip ./usbmmidd_v2_sciter.zip
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release_Sciter_x86/

          # 7. Generate the self-extracted portable installer (compiled as 32-bit)
          sed -i '/dpiAware/d' res/manifest.xml
          cp src/custom.txt Release_Sciter_x86/custom.txt || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release_Sciter_x86/ -o . -e ../../Release_Sciter_x86/rustdesk.exe
          popd

          # 8. Move and rename the final portable installer
          mkdir -p ./sciter_x86_out
          mv ./target/release/rustdesk-portable-packer.exe ./sciter_x86_out/${NEW_APP_NAME}-win7-legacy-x86.exe

      - name: Upload Sciter x86 Client Temp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-sciter-x86-client
          path: ./sciter_x86_out/

  merge-and-package:
    name: Merge and Package All Clients
    needs: [build-windows-flutter, build-windows-sciter-x64, build-windows-sciter-x86]
    runs-on: windows-2022
    steps:
      - name: Create Final Packages directory
        run: |
          mkdir ./finished_client
          mkdir ./finished_client/Flutter_Win10_x64
          mkdir ./finished_client/Sciter_Win7_Legacy_x64
          mkdir ./finished_client/Sciter_Win7_Legacy_x86

      - name: Download Flutter Client
        uses: actions/download-artifact@v4
        with:
          name: custom-flutter-client
          path: ./finished_client/Flutter_Win10_x64

      - name: Download Sciter x64 Client
        uses: actions/download-artifact@v4
        with:
          name: custom-sciter-x64-client
          path: ./finished_client/Sciter_Win7_Legacy_x64

      - name: Download Sciter x86 Client
        uses: actions/download-artifact@v4
        with:
          name: custom-sciter-x86-client
          path: ./finished_client/Sciter_Win7_Legacy_x86

      - name: Zip finished custom client package
        run: |
          Compress-Archive -Path ./finished_client/* -DestinationPath ./custom_client.zip

      - name: Upload Finished Custom Client Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.client_guid || github.event.inputs.client_guid }}-windows
          path: ./custom_client.zip
