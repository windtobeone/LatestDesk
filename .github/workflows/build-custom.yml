name: Build Custom Client
on:
  workflow_dispatch:
    inputs:
      client_guid:
        description: 'Unique identifier of custom client'
        required: true
      client_name:
        description: 'Application Name'
        required: true
      client_exe_name:
        description: 'Target executable filename'
        required: true
      client_prefix:
        description: 'Target filename prefix'
        required: true
      logo_png_base64:
        description: 'Base64 encoded custom logo'
        required: true
      relay_host:
        description: 'Rendezvous relay server host'
        required: true
      relay_key:
        description: 'Rendezvous server public key'
        required: true
      api_server:
        description: 'Preconfigured API server url'
        required: true
      custom_txt_base64:
        description: 'Signed custom.txt payload base64'
        required: true
      apply_patches:
        description: 'Comma-separated patch ids to apply (e.g. 03)'
        required: false
  repository_dispatch:
    types: [build-custom-client]

env:
  FLUTTER_RUST_VERSION: "1.80.1"
  SCITER_RUST_VERSION: "1.75.0"
  RUST_VERSION: "1.80.1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"


jobs:
  build-windows:
    name: Build Branded Windows Client
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust 1.80.1
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.FLUTTER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Install Rust 1.75.0
        run: |
          rustup toolchain install ${{ env.SCITER_RUST_VERSION }}-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc --toolchain ${{ env.SCITER_RUST_VERSION }}
        shell: bash


      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Pillow for Icon Generation
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Custom Icons and Assets
        run: |
          Set-Content -Path logo_base64.txt -Value "${{ github.event.client_payload.logo_png_base64 || github.event.inputs.logo_png_base64 }}"
          python make_icons.py logo_base64.txt "${{ github.event.client_payload.client_name || github.event.inputs.client_name }}"

      - name: Setup Custom Environment variables for oneKey.py
        shell: bash
        run: |
          echo "NEW_APP_NAME=${{ github.event.client_payload.client_name || github.event.inputs.client_name }}" >> $GITHUB_ENV
          echo "NEW_EXE_NAME=${{ github.event.client_payload.client_exe_name || github.event.inputs.client_exe_name }}" >> $GITHUB_ENV
          echo "NEW_PREFIX=${{ github.event.client_payload.client_prefix || github.event.inputs.client_prefix }}" >> $GITHUB_ENV
          echo "NEW_IP=${{ github.event.client_payload.relay_host || github.event.inputs.relay_host }}" >> $GITHUB_ENV
          echo "NEW_PUB_KEY=${{ github.event.client_payload.relay_key || github.event.inputs.relay_key }}" >> $GITHUB_ENV
          echo "NEW_API_SERVER=${{ github.event.client_payload.api_server || github.event.inputs.api_server }}" >> $GITHUB_ENV
          echo "CUSTOM_TXT_BASE64=${{ github.event.client_payload.custom_txt_base64 || github.event.inputs.custom_txt_base64 }}" >> $GITHUB_ENV
          echo "APPLY_PATCHES=${{ github.event.client_payload.apply_patches || github.event.inputs.apply_patches }}" >> $GITHUB_ENV

      - name: Run Customize Script and Apply Patches
        run: |
          python oneKey.py

      - name: Build Windows Flutter Executable
        run: |
          # Use Rust 1.80.1 for the Flutter build (so it matches the pre-generated bridge files)
          rustup default ${{ env.FLUTTER_RUST_VERSION }}-x86_64-pc-windows-msvc

          # 1. Build Windows Flutter Executable (64-bit modern UI)
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram

          # 2. Create the final output structure
          mkdir ./finished_client
          mkdir ./finished_client/Flutter_Win10_x64
          mkdir ./finished_client/Sciter_Win7_Legacy

          # Move compiled Flutter release files
          mv ./flutter/build/windows/x64/runner/Release/* ./finished_client/Flutter_Win10_x64/

          # Download usbmmidd_v2.zip and extract it to ./finished_client/Flutter_Win10_x64
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./finished_client/Flutter_Win10_x64/

          # Download printer driver files and extract them to ./finished_client/Flutter_Win10_x64
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./finished_client/Flutter_Win10_x64/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./finished_client/Flutter_Win10_x64/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./finished_client/Flutter_Win10_x64/
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: Find and Propagate Runner.res
        continue-on-error: true
        shell: bash
        run: |
          # Copy the generated resource file containing icons to libs/portable
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Build Windows Sciter Executable
        run: |
          # Use Rust 1.75.0 for the Sciter build (Win7 compatible, no bridge compilation needed)
          rustup default ${{ env.SCITER_RUST_VERSION }}-x86_64-pc-windows-msvc

          # 3. Build Windows Sciter Executable
          python3 .\build.py --portable --hwcodec --vram

          # Move and rename the Sciter portable exe to matched branding
          $sciter_exe = Get-ChildItem -Filter "rustdesk-*-win7-install.exe" | Select-Object -First 1
          if ($sciter_exe) {
              mv $sciter_exe.FullName "./finished_client/Sciter_Win7_Legacy/${env:NEW_APP_NAME}-win7-legacy.exe"
          } else {
              Write-Error "Sciter build failed to output executable!"
              exit 1
          }

      - name: Zip finished custom client package
        run: |
          # Compress both versions into custom_client.zip
          Compress-Archive -Path ./finished_client/* -DestinationPath ./custom_client.zip


      - name: Upload Finished Custom Client Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.client_guid || github.event.inputs.client_guid }}-windows
          path: ./custom_client.zip
